name: CI — lar-jepa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Mirror the local Lar_Main/ layout so path deps resolve identically:
      #   lar_jepa/pyproject.toml has:
      #     lar-engine = {path = "../lar"}          → Lar_Main/lar  ✅
      #     lar-dmn    = {path = "../DMN/lar"}       → Lar_Main/DMN/lar  ✅

      - name: Checkout lar_jepa → Lar_Main/lar_jepa
        uses: actions/checkout@v4
        with:
          path: Lar_Main/lar_jepa

      - name: Checkout lar-engine → Lar_Main/lar
        uses: actions/checkout@v4
        with:
          repository: snath-ai/lar
          path: Lar_Main/lar
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout lar-dmn → Lar_Main/DMN/lar
        uses: actions/checkout@v4
        with:
          repository: snath-ai/DMN
          path: Lar_Main/DMN/lar
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install lar_jepa + dev deps
        run: |
          cd Lar_Main/lar_jepa
          poetry install --no-interaction --with dev

      - name: Run tests
        run: |
          cd Lar_Main/lar_jepa
          poetry run pytest -v
